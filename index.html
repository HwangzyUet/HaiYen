<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng 20/10</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>

<body>

    <audio id="audio" loop preload="auto" playsinline webkit-playsinline>
        <source src="./music.mp3" type="audio/mpeg">
        <source src="./Floral%20Sea.mp3" type="audio/mpeg">
        <source src="./Floral Sea.mp3" type="audio/mpeg">
    </audio>

    <button id="musicToggle" class="music-toggle" title="Bật / Tắt nhạc">
        <span id="musicIcon" class="music-icon">❤️</span>
    </button>

    <div id="guideInfo">
        <div class="card" id="card">
            <div class="imgBox">
                <img src="./img/thiep.png" alt="Bìa thiệp">
                <div class="bark">
                    <div class="photo-frames">
                        <div class="photo-frame frame-1">
                            <img src="./img/haiyen1.jpg" alt="Hải Yến 1">
                        </div>
                        <div class="photo-frame frame-2">
                            <img src="./img/haiyen2.png" alt="Hải Yến 2">
                        </div>
                    </div>
                </div>
            </div>
            <div class="details">
                <h4 class="color margin"> Chúc Mừng 20/10 </h4>
                <p>Ngày 20/10 này, Hành chỉ mong</p>
                <p>mọi điều dịu dàng và tốt đẹp nhất,</p>
                <p>sẽ đến với Yến, </p>
                <p>chúc Yến một ngày thật đặc biệt,</p>
                <p>trọn vẹn niềm vui</p>
                <p>và luôn được yêu thương,</p>
                <p>mong nụ cười ấy sẽ luôn rạng rỡ</p>
                <p>như một đóa hoa.</p>
                <p class="text-right">Chúc mừng Ngày Phụ Nữ Việt Nam :3</p>
                <p class="text-right">♥Yêu Yến :3♥</p>
            </div>
        </div>
    </div>

    <div id="clickHint" class="click-hint"> Bấm vào thiệp đi :3 </div>
</body>

</html>
